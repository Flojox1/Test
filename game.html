<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0c08" />
<title>FloRod — Mantar Çiftliği</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/game.css" />
</head>
<body>

<header class="hud">
  <button class="profile-trigger" id="profileOpen" type="button" aria-label="Profili aç" title="Profil">👤</button>
  <div class="stat"><span class="lbl">Para</span><span class="val gold" id="statMoney">₺0</span></div>
  <div class="stat"><span class="lbl">Gün</span><span class="val" id="statDay">1</span></div>
  <div class="stat"><span class="lbl">Pazar</span><span class="val green" id="statPrice">₺0/kg</span></div>
  <div class="stat"><span class="lbl">Arsa</span><span class="val" id="statPlot">1</span></div>
  <div class="stat"><span class="lbl">Konteyner</span><span class="val" id="statContainer">1</span></div>
  <div class="hud-spacer"></div>
  <div class="speed-group" id="speedGroup">
    <button class="speed-btn" data-speed="1">1×</button>
    <button class="speed-btn" data-speed="2">2×</button>
    <button class="speed-btn" data-speed="5">5×</button>
    <button class="speed-btn" data-speed="10">10×</button>
  </div>
  <button id="resetBtn" type="button">Sıfırla</button>
</header>

<div class="tabs" id="tabs">
  <button class="tab active" data-tab="uretim">Üretim</button>
  <button class="tab" data-tab="arsalar">Arsalar</button>
  <button class="tab" data-tab="pazar">Pazar</button>
  <button class="tab" data-tab="ustalar">Ustalar</button>
  <button class="tab" data-tab="depo">Depo</button>
</div>

<main class="content" id="tabContent"></main>

<div class="modal-back" id="modalBack">
  <div class="modal" id="modal"></div>
</div>

<div class="profile-back" id="profileBack" aria-hidden="true">
  <section class="profile-card" role="dialog" aria-modal="true" aria-labelledby="profileTitle">
    <button class="profile-close" id="profileClose" type="button" aria-label="Profili kapat">×</button>
    <div class="profile-avatar">👤</div>
    <h2 id="profileTitle">Oyuncu Profili</h2>
    <div class="profile-name" id="profileName">Yükleniyor...</div>
    <div class="profile-email-label">GMAIL</div>
    <div class="profile-email" id="profileEmail">Yükleniyor...</div>
  </section>
</div>
<div class="profile-back" id="nameSetupBack" aria-hidden="true">
  <form class="profile-card" id="nameSetupForm" role="dialog" aria-modal="true" style="width:min(100%,360px)">
    <div class="profile-avatar">👤</div>
    <h2>Oyuncu Adını Belirle</h2>
    <p style="color:var(--muted);font-size:.78rem;line-height:1.5;margin:-4px 0 14px">Oyunda kullanacağın kullanıcı adını seç. Bu ad hesabına kaydedilecek.</p>
    <input id="playerNameInput" type="text" minlength="2" maxlength="20" autocomplete="nickname" placeholder="Kullanıcı adı" required style="width:100%;padding:13px;margin-bottom:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font: .9rem var(--font-body)" />
    <div id="nameSetupError" role="alert" style="min-height:18px;color:#ff8989;font-size:.7rem"></div>
    <button id="nameSetupSubmit" type="submit" style="width:100%;padding:13px;border:0;border-radius:8px;background:var(--green);color:#0a0c08;font-weight:700">OYUNA BAŞLA</button>
  </form>
</div>

<button class="chat-toggle" id="chatToggle" aria-label="Sohbet">💬<span class="badge" id="chatBadge"></span></button>
<aside class="chat-panel" id="chatPanel">
  <div class="chat-head">
    <span>Flo Diyarı Sohbet</span>
    <span class="online off" id="chatStatus">Bağlanıyor...</span>
    <button class="chat-close" id="chatClose" aria-label="Kapat">×</button>
  </div>
  <div class="chat-messages" id="chatMessages">
    <div class="chat-empty" id="chatEmpty">Henüz mesaj yok. İlk konuşan sen ol.</div>
  </div>
  <form class="chat-form" id="chatForm">
    <input type="text" id="chatInput" placeholder="Mesaj yaz..." maxlength="200" autocomplete="off" disabled />
    <button type="submit" id="chatSend" disabled>Gönder</button>
  </form>
</aside>

<script type="module" src="js/main.js"></script>

</body>
</html>
