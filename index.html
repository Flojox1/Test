<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#08080a" />
<title>FloRod</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #08080a; --surface: #101014; --text: #e6e2d8; --muted: #7d7a72;
    --blood: #8b1a1a; --blood-bright: #b02525; --border: #232329;
    --font-head: 'Cinzel', serif; --font-body: 'Inter', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-body);
    -webkit-font-smoothing: antialiased; overflow: hidden; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 50% 35%, rgba(139,26,26,0.14) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 50% 100%, rgba(184,196,204,0.05) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(35,35,41,0.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(35,35,41,0.35) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(ellipse 75% 65% at 50% 45%, black 0%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 75% 65% at 50% 45%, black 0%, transparent 100%);
    pointer-events: none; z-index: 0;
  }
  .stage {
    position: relative; z-index: 1;
    height: 100%; height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .tag {
    font-size: 0.62rem; letter-spacing: 5px; text-transform: uppercase;
    color: var(--blood-bright); border: 1px solid rgba(176,37,37,0.4);
    padding: 6px 16px; margin-bottom: 36px; font-weight: 600;
    animation: rise 0.9s ease both;
  }
  .title {
    font-family: var(--font-head); font-weight: 900;
    font-size: clamp(3rem, 14vw, 8rem); line-height: 0.92;
    letter-spacing: 2px; text-transform: uppercase;
    animation: rise 0.9s 0.08s ease both;
  }
  .title em { font-style: normal; color: var(--blood-bright); }
  .subtitle {
    margin-top: 18px; font-size: clamp(0.7rem, 2vw, 0.8rem);
    font-weight: 300; letter-spacing: 6px; text-transform: uppercase;
    color: var(--muted); animation: rise 0.9s 0.16s ease both;
  }
  .play-wrap { margin-top: clamp(28px, 5vh, 48px); animation: rise 0.9s 0.28s ease both; width:min(100%,390px); }
  .auth-card { width:100%; padding:24px; text-align:left; background:rgba(16,16,20,.94); border:1px solid rgba(176,37,37,.28); box-shadow:0 20px 70px rgba(0,0,0,.42); backdrop-filter:blur(14px); }
  .auth-tabs { display:flex; gap:8px; margin-bottom:18px; }
  .auth-tab { flex:1; padding:11px; color:var(--muted); background:#17171d; border:1px solid var(--border); cursor:pointer; font:600 .72rem var(--font-body); letter-spacing:1px; }
  .auth-tab.active { color:var(--text); border-color:var(--blood-bright); background:rgba(139,26,26,.22); }
  .auth-form { display:grid; gap:10px; }
  .auth-form[hidden] { display:none; }
  .auth-form label { color:var(--muted); font-size:.65rem; letter-spacing:1px; text-transform:uppercase; text-align:left; }
  .auth-form input { width:100%; padding:13px 14px; color:var(--text); background:#09090c; border:1px solid var(--border); outline:none; font: .9rem var(--font-body); }
  .auth-form input:focus { border-color:var(--blood-bright); }
  .auth-submit { margin-top:6px; width:100%; padding:14px; color:var(--text); background:var(--blood); border:1px solid rgba(176,37,37,.6); cursor:pointer; font:700 .8rem var(--font-head); letter-spacing:2px; }
  .auth-submit:disabled { opacity:.55; cursor:wait; }
  .auth-help { color:var(--muted); background:none; border:0; cursor:pointer; font:.7rem var(--font-body); padding:8px; }
  .auth-status { min-height:34px; color:#d6c8a0; font-size:.72rem; line-height:1.5; text-align:center; margin-top:12px; overflow-wrap:anywhere; }
  .auth-status.error { color:#ff8989; }
  .auth-note { color:var(--muted); font-size:.65rem; line-height:1.5; text-align:center; margin-top:12px; }
  .play {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    gap: 14px; padding: 22px 64px;
    font-family: var(--font-head); font-weight: 700;
    font-size: clamp(1rem, 3.5vw, 1.35rem); letter-spacing: 6px; text-transform: uppercase;
    color: var(--text); background: var(--blood); border: 1px solid rgba(176,37,37,0.6);
    cursor: pointer;
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    transition: background 0.25s, transform 0.15s, box-shadow 0.3s;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  .play::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.12) 50%, transparent 70%);
    transform: translateX(-120%); transition: transform 0.6s ease;
  }
  .play:hover { background: var(--blood-bright); box-shadow: 0 0 40px rgba(176,37,37,0.35); }
  .play:hover::before { transform: translateX(120%); }
  .play:active { transform: scale(0.97); }
  .play .arrow { font-size: 0.8em; opacity: 0.85; transition: transform 0.25s; }
  .play:hover .arrow { transform: translateX(5px); }
  .foot {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 2;
    padding: 18px 24px calc(18px + env(safe-area-inset-bottom));
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); opacity: 0.7; pointer-events: none;
  }
  .foot span { pointer-events: auto; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(22px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-out {
    position: fixed; inset: 0; z-index: 50; background: var(--bg);
    opacity: 0; pointer-events: none; transition: opacity 0.6s ease;
  }
  .fade-out.on { opacity: 1; pointer-events: all; }
  @media (max-width: 480px) {
    .play { padding: 20px 48px; letter-spacing: 4px; }
    .subtitle { letter-spacing: 4px; }
    .foot { font-size: 0.55rem; letter-spacing: 1.5px; }
  }
  @media (max-height: 520px) {
    .tag { margin-bottom: 20px; }
    .play-wrap { margin-top: 32px; }
    .subtitle { margin-top: 10px; }
  }
</style>
</head>
<body>

<div class="stage">
  <span class="tag">Erken Erişim</span>
  <h1 class="title">Flo<em>Rod</em></h1>
  <p class="subtitle">Çeliğin Ağırlığı</p>
  <div class="play-wrap">
    <section class="auth-card" aria-label="Oyuncu hesabı">
      <div class="auth-tabs">
        <button class="auth-tab active" id="loginTab" type="button">GİRİŞ YAP</button>
        <button class="auth-tab" id="registerTab" type="button">KAYIT OL</button>
      </div>
      <form class="auth-form" id="loginForm">
        <label for="loginEmail">Gmail / E-posta</label>
        <input id="loginEmail" type="email" autocomplete="email" placeholder="ornek@gmail.com" required maxlength="254" />
        <label for="loginPassword">Şifre</label>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Şifren" required minlength="6" />
        <button class="auth-submit" type="submit">OYUNA GİR ›</button>
        <button class="auth-help" id="forgotPassword" type="button">Şifremi unuttum</button>
      </form>
      <form class="auth-form" id="registerForm" hidden>
        <label for="registerEmail">Gmail / E-posta</label>
        <input id="registerEmail" type="email" autocomplete="email" placeholder="ornek@gmail.com" required maxlength="254" />
        <label for="registerPassword">Şifre (en az 6 karakter)</label>
        <input id="registerPassword" type="password" autocomplete="new-password" placeholder="Şifre oluştur" required minlength="6" />
        <label for="registerPassword2">Şifre tekrar</label>
        <input id="registerPassword2" type="password" autocomplete="new-password" placeholder="Şifreyi tekrar gir" required minlength="6" />
        <button class="auth-submit" type="submit">HESAP OLUŞTUR</button>
      </form>
      <div class="auth-status" id="authStatus" role="status" aria-live="polite"></div>
      <p class="auth-note">Kayıt sonrası e-posta adresine doğrulama bağlantısı gönderilir. Doğrulamadan oyuna giriş yapılamaz.</p>
    </section>
  </div>
</div>

<div class="foot">
  <span>© 2026 FloRod</span>
  <span>v0.1</span>
</div>

<div class="fade-out" id="fadeOut"></div>

<script type="module">
  import { registerWithEmail, loginWithEmail, resetPassword } from './js/auth.js';
  const $ = id => document.getElementById(id);
  let mode = 'login';
  function setMode(next) {
    mode = next;
    $('loginForm').hidden = next !== 'login';
    $('registerForm').hidden = next !== 'register';
    $('loginTab').classList.toggle('active', next === 'login');
    $('registerTab').classList.toggle('active', next === 'register');
    $('authStatus').textContent = '';
    $('authStatus').classList.remove('error');
  }
  function status(message, error=false) {
    $('authStatus').textContent = message;
    $('authStatus').classList.toggle('error', error);
  }
  function busy(form, yes) {
    const button = form.querySelector('.auth-submit');
    button.disabled = yes;
    button.textContent = yes ? 'İŞLENİYOR...' : (form.id === 'loginForm' ? 'OYUNA GİR ›' : 'HESAP OLUŞTUR');
  }
  $('loginTab').addEventListener('click', () => setMode('login'));
  $('registerTab').addEventListener('click', () => setMode('register'));
  $('registerForm').addEventListener('submit', async e => {
    e.preventDefault();
    const form=e.currentTarget, email=$('registerEmail').value.trim();
    const password=$('registerPassword').value, confirm=$('registerPassword2').value;
    if(password.length<6) return status('Şifre en az 6 karakter olmalı.',true);
    if(password!==confirm) return status('Şifreler eşleşmiyor.',true);
    busy(form,true);
    try {
      await registerWithEmail(email,password);
      form.reset();
      setMode('login');
      $('loginEmail').value=email;
      status('Hesabın oluşturuldu. Gmail gelen kutuna doğrulama bağlantısı gönderdik. Spam klasörünü de kontrol et. Doğruladıktan sonra giriş yapabilirsin.');
    } catch(err) {
      const messages={
        'auth/email-already-in-use':'Bu e-posta ile zaten hesap var. Giriş yapmayı dene.',
        'auth/invalid-email':'E-posta adresi geçersiz.',
        'auth/weak-password':'Şifre yeterince güçlü değil.',
        'auth/operation-not-allowed':'Firebase Console’da Email/Password giriş yöntemini etkinleştir.'
      };
      status(messages[err.code] || err.message || 'Kayıt oluşturulamadı.',true);
    } finally { busy(form,false); }
  });
  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const form=e.currentTarget, email=$('loginEmail').value.trim(), password=$('loginPassword').value;
    busy(form,true);
    try {
      await loginWithEmail(email,password);
      $('fadeOut').classList.add('on');
      setTimeout(()=>{window.location.href='game.html';},350);
    } catch(err) {
      const messages={
        'auth/email-not-verified':'E-posta adresin henüz doğrulanmamış. Gelen kutunu kontrol et.',
        'auth/invalid-credential':'E-posta veya şifre hatalı.',
        'auth/user-not-found':'Bu hesap bulunamadı. Önce kayıt ol.',
        'auth/wrong-password':'Şifre hatalı.',
        'auth/too-many-requests':'Çok fazla deneme yapıldı. Bir süre sonra tekrar dene.',
        'auth/operation-not-allowed':'Firebase Console’da Email/Password giriş yöntemini etkinleştir.'
      };
      status(messages[err.code] || err.message || 'Giriş yapılamadı.',true);
    } finally { busy(form,false); }
  });
  $('forgotPassword').addEventListener('click', async()=>{
    const email=$('loginEmail').value.trim();
    if(!email) return status('Önce e-posta adresini gir.',true);
    try { await resetPassword(email); status('Şifre sıfırlama bağlantısı e-posta adresine gönderildi.'); }
    catch(err) { status(err.message || 'Bağlantı gönderilemedi.',true); }
  });
</script>

</body>
</html>
