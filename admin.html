<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FloRod Yönetim</title><link rel="stylesheet" href="css/game.css"><style>
body{overflow:auto;min-height:100dvh;height:auto;padding:24px}.admin-wrap{width:min(100%,900px);margin:30px auto}.admin-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin:14px 0}.admin-form{display:grid;gap:12px;max-width:380px}.admin-form input,.admin-input{padding:12px;background:#090c08;border:1px solid var(--border);color:var(--text);border-radius:6px}.admin-tabs{display:flex;gap:8px;flex-wrap:wrap}.admin-tabs button{padding:11px 18px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:6px}.admin-tabs button.active{border-color:var(--gold);color:var(--gold)}.admin-row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--border);padding:12px 0}.admin-actions{display:flex;gap:6px;flex-wrap:wrap}.admin-actions button{padding:8px 10px}.admin-muted{color:var(--muted);font-size:.8rem}.admin-danger{background:#6d2020!important}.admin-ok{background:#315d2a!important}#adminStatus{min-height:24px;color:var(--gold)}
</style></head><body><main class="admin-wrap">
<div class="section-head"><h2>FloRod Yönetim Paneli</h2><a href="index.html">Oyuncu girişine dön</a></div>
<section class="admin-card" id="loginCard"><h3>Yönetici girişi</h3><p class="admin-muted">Yönetici hesabı e-posta adresi kullanmaz.</p><form class="admin-form" id="adminLogin"><input id="adminUser" placeholder="Kullanıcı adı" autocomplete="username" value="admin" required><input id="adminPass" type="password" placeholder="Şifre" autocomplete="current-password" required><button class="btn btn-green" type="submit">Giriş yap</button></form><p id="adminStatus"></p></section>
<section id="dashboard" hidden><div class="admin-card"><div class="admin-row"><div><h3>Yönetim</h3><span class="admin-muted">Oyuncu ve sohbet işlemleri</span></div><button class="btn btn-ghost" id="adminLogout">Çıkış</button></div><nav class="admin-tabs"><button class="active" data-admin-tab="players">Players</button><button data-admin-tab="chat">Chat</button></nav></div>
<div class="admin-card" id="playersPane"><div class="admin-row"><h3>Oyuncular</h3><button class="btn btn-ghost" id="refreshPlayers">Yenile</button></div><input class="admin-input" id="playerSearch" type="search" placeholder="Oyuncu ismine göre ara..." aria-label="Oyuncu ismine göre ara" style="width:100%;margin:8px 0 14px"><div id="playersList">Yükleniyor...</div></div>
<div class="admin-card" id="chatPane" hidden><div class="admin-row"><h3>Sohbet yönetimi</h3><div class="admin-actions"><span id="chatStateLabel" class="admin-muted">Durum yükleniyor...</span><button class="btn btn-ghost" id="chatToggleAdmin" type="button">Sohbet durumu yükleniyor</button><button class="btn admin-danger" id="clearChat">Tüm mesajları sil</button></div></div><div id="chatList">Yükleniyor...</div></div></section>
</main><script type="module" src="js/admin.js"></script></body></html>
